name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aicamera3rd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Download and convert MAXIM FiveK neural model
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 huggingface_hub==0.26.5
          python tools/convert_maxim_fivek.py
          python tools/download_extra_models.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK with bundled neural model
        run: gradle assembleDebug
      - name: Verify APK signature and archive integrity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          zip -T "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"
      - name: Run app startup smoke test on cloud Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          script: |
            set +e
            APK="app/build/outputs/apk/debug/app-debug.apk"
            adb logcat -c
            adb install -r "$APK"
            INSTALL_STATUS=$?
            if [ "$INSTALL_STATUS" -eq 0 ]; then
              adb shell pm grant com.aicamera.pro android.permission.CAMERA
              adb shell am start -W -n com.aicamera.pro/.MainActivity
              START_STATUS=$?
              sleep 90
              APP_PID=$(adb shell pidof com.aicamera.pro | tr -d '\r')
            else
              START_STATUS=1
              APP_PID=""
            fi
            adb logcat -d -v time > emulator-logcat.txt
            {
              echo "install_status=$INSTALL_STATUS"
              echo "start_status=$START_STATUS"
              echo "app_pid=$APP_PID"
              adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            } > emulator-smoke-summary.txt
            if [ "$INSTALL_STATUS" -ne 0 ] || [ "$START_STATUS" -ne 0 ] || [ -z "$APP_PID" ]; then
              echo "Android emulator startup smoke test failed."
              exit 1
            fi
            echo "App remained running for 90 seconds on the cloud Android emulator."
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            emulator-logcat.txt
            emulator-smoke-summary.txt
          if-no-files-found: ignore
      - name: Name APK with Bangladesh time
        id: apk
        run: |
          STAMP=$(TZ=Asia/Dhaka date +'%Y%m%d-%H%M%S-BD')
          NAME="AI-Camera-Pro-OnePlus8-${STAMP}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" > "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release delete latest --yes || true
          gh release create latest "$APK_NAME" "$APK_NAME.sha256" --title "AI Camera Pro latest" --notes "Build is checked with zip integrity and apksigner verification before publishing. SHA-256 checksum file is included. Bundled offline neural models."
