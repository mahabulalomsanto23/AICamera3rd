name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aicamera3rd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fast Python pre-check
        run: python -m py_compile tools/*.py
      - name: Restore validated offline AI model cache
        id: ai-model-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets
          key: aicamera3rd-ai-models-v1-${{ hashFiles('tools/convert_maxim_fivek.py', 'tools/download_extra_models.py') }}
      - name: Download and convert models (cache miss only)
        if: steps.ai-model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 huggingface_hub==0.26.5
          python tools/convert_maxim_fivek.py
          python tools/download_extra_models.py
      - name: Validate offline model bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          models = [
              Path("app/src/main/assets/maxim_fivek_fp16.tflite"),
              Path("app/src/main/assets/nafnet_sidd_width32_fp16.tflite"),
              Path("app/src/main/assets/deeplabv3_ade20k.tflite"),
              Path("app/src/main/assets/realesrgan_general_x4v3.tflite"),
          ]
          for model in models:
              if not model.is_file() or model.stat().st_size < 1024 * 1024:
                  raise SystemExit(f"Missing or unexpectedly small model: {model}")
              with model.open("rb") as stream:
                  header = stream.read(8)
              if header[4:8] != b"TFL3":
                  raise SystemExit(f"Invalid TFLite FlatBuffer header: {model}")
              print(f"OK {model}: {model.stat().st_size:,} bytes")
          PY
      - name: Save verified offline AI model cache
        if: steps.ai-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets
          key: aicamera3rd-ai-models-v1-${{ hashFiles('tools/convert_maxim_fivek.py', 'tools/download_extra_models.py') }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent APK signing (one-time repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aicamera-release.jks"
            test -s "$RUNNER_TEMP/aicamera-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/aicamera-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "ANDROID_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/aicamera-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Persistent release signing configured."
          else
            echo "ANDROID_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing secrets are not configured. This fallback debug APK cannot reliably update an installation signed by another runner."
          fi
      - name: Build ABI-specific APKs with bundled neural model
        run: |
          if [ "$ANDROID_SIGNING_CONFIGURED" = "true" ]; then
            gradle assembleRelease
            APK_DIR="app/build/outputs/apk/release"
            APK_NAME="app-arm64-v8a-release.apk"
            test -s "$APK_DIR/$APK_NAME"
            test -s "$APK_DIR/app-x86_64-release.apk"
          else
            gradle assembleDebug
            APK_DIR="app/build/outputs/apk/debug"
            APK_NAME="app-arm64-v8a-debug.apk"
            test -s "$APK_DIR/$APK_NAME"
            test -s "$APK_DIR/app-x86_64-debug.apk"
          fi
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK_DIR"/*.apk
      - name: Verify APK signature and archive integrity
        run: |
          APK="$GITHUB_WORKSPACE/$APK_DIR/$APK_NAME"
          test -f "$APK"
          zip -T "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"
      - name: Name APK with Bangladesh time
        id: apk
        run: |
          STAMP=$(TZ=Asia/Dhaka date +'%Y%m%d-%H%M%S-BD')
          NAME="AI-Camera-Pro-OnePlus8-${STAMP}.apk"
          cp "$APK_DIR/$APK_NAME" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" > "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
      - name: Publish latest APK release
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release delete latest --yes || true
          gh release create latest "$APK_NAME" "$APK_NAME.sha256" --title "AI Camera Pro latest" --notes "Build is checked with zip integrity and apksigner verification before publishing. SHA-256 checksum file is included. Bundled offline neural models."
