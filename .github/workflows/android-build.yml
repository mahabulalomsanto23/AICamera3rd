name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aicamera3rd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fast Python pre-check
        run: python -m py_compile tools/*.py
      - name: Restore validated offline AI model cache
        id: ai-model-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets
          key: aicamera3rd-ai-models-v1-${{ hashFiles('tools/convert_maxim_fivek.py', 'tools/download_extra_models.py') }}
      - name: Download and convert models (cache miss only)
        if: steps.ai-model-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow-cpu==2.15.1 huggingface_hub==0.26.5
          python tools/convert_maxim_fivek.py
          python tools/download_extra_models.py
      - name: Validate offline model bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          models = [
              Path("app/src/main/assets/maxim_fivek_fp16.tflite"),
              Path("app/src/main/assets/nafnet_sidd_width32_fp16.tflite"),
              Path("app/src/main/assets/deeplabv3_ade20k.tflite"),
          ]
          for model in models:
              if not model.is_file() or model.stat().st_size < 1024 * 1024:
                  raise SystemExit(f"Missing or unexpectedly small model: {model}")
              with model.open("rb") as stream:
                  header = stream.read(8)
              if header[4:8] != b"TFL3":
                  raise SystemExit(f"Invalid TFLite FlatBuffer header: {model}")
              print(f"OK {model}: {model.stat().st_size:,} bytes")
          PY
      - name: Save verified offline AI model cache
        if: steps.ai-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets
          key: aicamera3rd-ai-models-v1-${{ hashFiles('tools/convert_maxim_fivek.py', 'tools/download_extra_models.py') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ABI-specific debug APKs with bundled neural model
        run: |
          gradle assembleDebug
          test -s app/build/outputs/apk/debug/app-x86_64-debug.apk
          test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          ls -lh app/build/outputs/apk/debug/*.apk
      - name: Verify APK signature and archive integrity
        run: |
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          test -f "$APK"
          zip -T "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"
      - name: Prepare emulator smoke test script
        run: |
          mkdir -p .github
          cat > .github/emulator-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          APK="$ROOT/app/build/outputs/apk/debug/app-x86_64-debug.apk"
          STAGE="initialize"
          APP_PID=""

          capture_diagnostics() {
            local rc=$?
            trap - EXIT
            set +e
            timeout 15s adb logcat -d -v time > "$ROOT/emulator-logcat.txt" 2>&1 || true
            timeout 20s adb shell dumpsys activity lastanr > "$ROOT/emulator-last-anr.txt" 2>&1 || true
            timeout 20s adb shell dumpsys meminfo com.aicamera.pro > "$ROOT/emulator-app-meminfo.txt" 2>&1 || true
            {
              echo "exit_code=$rc"
              echo "failed_stage=$STAGE"
              echo "app_pid_at_exit=${APP_PID:-none}"
              echo "current_app_pid=$(timeout 10s adb shell pidof com.aicamera.pro 2>/dev/null | tr -d '\r' || true)"
              echo "boot_completed=$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              timeout 15s adb shell dumpsys activity activities 2>&1 | grep -E "mResumedActivity|topResumedActivity" || true
            } > "$ROOT/emulator-smoke-summary.txt"
            exit "$rc"
          }
          trap capture_diagnostics EXIT

          STAGE="verify-apk"
          echo "Workspace: $ROOT"
          echo "APK: $APK"
          test -s "$APK"

          STAGE="wait-for-emulator"
          timeout 120s adb wait-for-device
          BOOTED=""
          for attempt in $(seq 1 60); do
            BOOTED="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [[ "$BOOTED" == "1" ]] && break
            sleep 2
          done
          test "$BOOTED" = "1"

          STAGE="clear-logcat"
          timeout 10s adb logcat -c 2>/dev/null || echo "WARNING: logcat buffer clear timed out or failed; continuing with tag-filtered diagnostics."
          STAGE="install-apk"
          timeout 900s adb install --no-streaming -r "$APK"

          STAGE="grant-camera-permission"
          timeout 15s adb shell pm grant com.aicamera.pro android.permission.CAMERA
          timeout 15s adb shell pm grant com.aicamera.pro android.permission.POST_NOTIFICATIONS || true

          STAGE="launch-main-activity"
          timeout 15s adb shell am start -n com.aicamera.pro/.MainActivity

          STAGE="wait-for-app-process"
          for attempt in $(seq 1 15); do
            APP_PID="$(timeout 10s adb shell pidof com.aicamera.pro 2>/dev/null | tr -d '\r' || true)"
            [[ -n "$APP_PID" ]] && break
            sleep 2
          done
          test -n "$APP_PID"

          STAGE="stability-check-30s"
          sleep 30
          APP_PID_AFTER="$(timeout 10s adb shell pidof com.aicamera.pro 2>/dev/null | tr -d '\r' || true)"
          test -n "$APP_PID_AFTER"
          echo "App remained running for 30 seconds on the cloud Android emulator."
          timeout 15s adb shell screencap -p /sdcard/aicamera-preview.png || true
          timeout 30s adb pull /sdcard/aicamera-preview.png "$ROOT/emulator-preview.png" || true

          STAGE="ai-processing-benchmark"
          adb logcat -c 2>/dev/null || echo "WARNING: logcat buffer clear unavailable; continuing with tag-filtered diagnostics."
          TEST_INPUT="$ROOT/testdata/aicamera3rd-test-photo.jpg"
          test -s "$TEST_INPUT"
          file "$TEST_INPUT"
          sha256sum "$TEST_INPUT" | tee "$ROOT/test-input-photo.sha256"
          cp "$TEST_INPUT" "$ROOT/test-input-photo.jpg"
          DEVICE_INPUT="/sdcard/Android/data/com.aicamera.pro/files/aicamera3rd-test-photo.jpg"
          timeout 10s adb shell mkdir -p "/sdcard/Android/data/com.aicamera.pro/files"
          timeout 60s adb push "$TEST_INPUT" "$DEVICE_INPUT"
          timeout 10s adb shell test -s "$DEVICE_INPUT"
          adb logcat -c 2>/dev/null || echo "WARNING: logcat buffer clear unavailable; continuing with tag-filtered diagnostics."
          echo "Starting AI processing on the fixed CI test photo…"
          BENCHMARK_DONE=""
          adb logcat -v time "AICameraProcessing:I" "AICameraBenchmark:I" "AICameraNafNet:I" "*:S" > "$ROOT/ai-benchmark-logcat.txt" 2>&1 &
          LOGCAT_PID=$!
          timeout 90s adb shell am start -n com.aicamera.pro/.BenchmarkActivity \
            --es com.aicamera.pro.extra.INPUT "$DEVICE_INPUT" \
            --es com.aicamera.pro.extra.MODE AI
          timeout 10s adb shell input keyevent 3 || true
          echo "Benchmark activity launched; photo processing continues in foreground service."
          for attempt in $(seq 1 300); do
            grep -E "BENCHMARK_RESULT" "$ROOT/ai-benchmark-logcat.txt" > "$ROOT/ai-benchmark.txt" || true
            if grep -q "BENCHMARK_RESULT" "$ROOT/ai-benchmark.txt"; then
              BENCHMARK_DONE="yes"
              break
            fi
            if grep -q "BENCHMARK_START_FAILED" "$ROOT/ai-benchmark-logcat.txt"; then
              echo "Debug benchmark activity could not start the processing service." | tee "$ROOT/ai-benchmark.txt"
              kill "$LOGCAT_PID" 2>/dev/null || true
              wait "$LOGCAT_PID" 2>/dev/null || true
              timeout 15s adb logcat -d -v time > "$ROOT/ai-benchmark-full-logcat.txt" 2>&1 || true
              exit 1
            fi
            if ! timeout 10s adb shell pidof com.aicamera.pro 2>/dev/null | tr -d '\r' | grep -q '[0-9]'; then
              echo "App process exited before the AI benchmark result was logged." | tee "$ROOT/ai-benchmark.txt"
              kill "$LOGCAT_PID" 2>/dev/null || true
              wait "$LOGCAT_PID" 2>/dev/null || true
              timeout 15s adb logcat -d -v time > "$ROOT/ai-benchmark-full-logcat.txt" 2>&1 || true
              timeout 15s adb shell dumpsys activity services com.aicamera.pro > "$ROOT/ai-service-state.txt" 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          kill "$LOGCAT_PID" 2>/dev/null || true
          wait "$LOGCAT_PID" 2>/dev/null || true
          grep -E "BENCHMARK_RESULT" "$ROOT/ai-benchmark-logcat.txt" > "$ROOT/ai-benchmark.txt" || true

          if [[ "$BENCHMARK_DONE" != "yes" ]]; then
            echo "AI benchmark did not finish within 10 minutes." | tee "$ROOT/ai-benchmark.txt"
            timeout 10s adb shell pidof com.aicamera.pro || true
            adb shell dumpsys activity services com.aicamera.pro > "$ROOT/ai-service-state.txt" 2>&1 || true
            adb logcat -d -v time > "$ROOT/ai-benchmark-full-logcat.txt" 2>&1 || true
            exit 1
          fi
          cat "$ROOT/ai-benchmark.txt"
          if grep -q "status=failure" "$ROOT/ai-benchmark.txt"; then
            echo "AI processing benchmark reported a failure."
            exit 1
          fi

          STAGE="collect-processed-photo"
          OUTPUT_FILE="$(timeout 15s adb shell 'ls -t /sdcard/Pictures/AICamera3rd/AICamera3rd_*.jpg 2>/dev/null | head -n 1' | tr -d '\r')"
          if [[ -z "$OUTPUT_FILE" ]]; then
            echo "Processing log reported success but no Gallery output was found."
            timeout 15s adb shell find /sdcard/Pictures/AICamera3rd -maxdepth 1 -type f -print || true
            exit 1
          fi
          timeout 60s adb pull "$OUTPUT_FILE" "$ROOT/processed-test-photo.jpg"
          test -s "$ROOT/processed-test-photo.jpg"
          sha256sum "$ROOT/processed-test-photo.jpg" > "$ROOT/processed-test-photo.jpg.sha256"
          echo "Processed photo collected: $OUTPUT_FILE"

          STAGE="completed"
          SCRIPT
          chmod +x .github/emulator-smoke.sh
      - name: Run app startup smoke test on cloud Android emulator
        if: ${{ true }} # Run the actual bundled neural model before publishing the APK.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -cores 4 -memory 6144 -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/.github/emulator-smoke.sh"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: |
            ${{ github.workspace }}/emulator-logcat.txt
            ${{ github.workspace }}/emulator-last-anr.txt
            ${{ github.workspace }}/emulator-app-meminfo.txt
            ${{ github.workspace }}/emulator-smoke-summary.txt
            ${{ github.workspace }}/emulator-preview.png
            ${{ github.workspace }}/ai-benchmark.txt
            ${{ github.workspace }}/ai-benchmark-logcat.txt
            ${{ github.workspace }}/ai-benchmark-full-logcat.txt
            ${{ github.workspace }}/ai-service-state.txt
            ${{ github.workspace }}/processed-test-photo.jpg
            ${{ github.workspace }}/processed-test-photo.jpg.sha256
          if-no-files-found: ignore
      - name: Name APK with Bangladesh time
        id: apk
        run: |
          STAMP=$(TZ=Asia/Dhaka date +'%Y%m%d-%H%M%S-BD')
          NAME="AI-Camera-Pro-OnePlus8-${STAMP}.apk"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME" > "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release delete latest --yes || true
          gh release create latest "$APK_NAME" "$APK_NAME.sha256" --title "AI Camera Pro latest" --notes "Build is checked with zip integrity and apksigner verification before publishing. SHA-256 checksum file is included. Bundled offline neural models."
